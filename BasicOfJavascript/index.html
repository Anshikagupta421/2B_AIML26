<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum of Number</title>
</head>
<script>
    function sum(){
        let a=10;
        let b=20;
        let c=a+b;
        document.write(c); //print on browser
        // console.log(c); //print on console
    }
</script>
<body>
    <input type="button" onclick="sum()" value="Result">
</body>
</html>
