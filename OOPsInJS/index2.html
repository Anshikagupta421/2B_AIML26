    <script>
        class Student{
            
            constructor(name,roll,year){
                this.name=name;
                this.roll=roll;
                this.year=year;

            }
            display(){
               console.log(`Name: ${this.name}`);
               console.log(`Roll: ${this.roll}`);
                console.log(`Year: ${this.year}`);
            }

        }
        
        let s1=new Student("Anshika",101,2010);
        console.log(s1);
    </script>
